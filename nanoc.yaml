    bio_source: wikipedia
    picture: "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Beno%C3%AEt_Philippon_%28born_1976%29_in_the_video_%27Beno%C3%AEt_Philippon_-_The_Strange_Odyssey_of_the_Monsieur_Family%27.png/330px-Beno%C3%AEt_Philippon_%28born_1976%29_in_the_video_%27Beno%C3%AEt_Philippon_-_The_Strange_Odyssey_of_the_Monsieur_Family%27.png"

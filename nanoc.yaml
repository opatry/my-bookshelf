text_extensions: [ 'adoc', 'asciidoc', 'atom', 'coffee', 'css', 'erb', 'haml', 'handlebars', 'hb', 'htm', 'html', 'svg', 'js', 'less', 'markdown', 'md', 'ms', 'mustache', 'org', 'php', 'rb', 'rdoc', 'sass', 'scss', 'slim', 'tex', 'txt', 'xhtml', 'xml' ]

prune:
  auto_prune: true

enable_output_diff: true

data_sources:
  - type: filesystem
    encoding: utf-8

environments:
  default:
    dev: true
    site:
      url: 'http://localhost:3000' # FIXME not very nice to hardcode port
  prod:
    dev: false
    site:
      url: https://lecture.opatry.net

site:
  lang: fr
  title: 📚 Les lectures d'Olivier
  description: Les livres que j'ai lu avec une note et un résumé rapide pour partager.
  uuid: 4effbc5e-6476-4f0b-a81c-77011812d4f6
  feed:
    max_entries: 20

social:
  badge_size: 25
  badges:
    babelio:
      label: Babelio
      icon_identifier: '/static/babelio.*'
      tint: '#fbb91e'
      base_url: https://www.babelio.com/
      self_page_path: bibliotheque.php?&s1=1&id_user=1664025&tri=note&sens=decroissant
      self_page_label: Mon profil Babelio
      book_page_path_prefix: livres/
    sc:
      label: SensCritique
      icon_identifier: '/static/senscritique.*'
      tint: '#000000'
      base_url: https://www.senscritique.com/
      self_page_path: OlivYé/collection?universe=2&action=RATING&order=MY_RATING_DESC
      self_page_label: Mon profil SensCritique
      book_page_path_prefix: livre/
    rss:
      label: RSS
      icon_identifier: '/static/rss.*'
      tint: '#6ddfe3'
      base_url: https://lecture.opatry.net/
      self_page_path: feed.xml
      self_page_label: Flux RSS


pwa_screenshot_width:
  phone: 651
  desktop: 470
favicon_reprs: [ 'default' ]
cover:
  quality: '85%'
  width:
    mini: 50 # width of mini cover in main table (see content/index.html `formatterParams`)
    medium: 75 # width of medium cover in recent readings (see content/static/style.css `.book-cover-card`)
    showcase: 300 # width of cover when displayed showcased (see content/static/style.css `.book-showcase img`) 
    default: 150 # width of cover by default (see content/static/style.css `.book-cover`)
avatar_size:
  compact: 48
  default: 128

# Author metadata, drafted with ./fetch_author.sh and curated by hand (Wikidata +
# fr.wikipedia). bios with bio_source: wikipedia are CC BY-SA 4.0 extracts — display
# attribution pending plan step B4 (docs/plan-author-pages.md). picture: URLs will move
# to local files under content/static/authors/ at plan step D2.
author:
  agatha-christie:
    wikidata: Q35064
    bio: "Agatha Christie, née Miller le 15 septembre 1890 à Torquay (Devon), et morte le 12 janvier 1976 à Wallingford (Oxfordshire), est une femme de lettres britannique, autrice de nombreux romans policiers."
    bio_source: wikipedia
    picture: "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Agatha_Christie_in_Nederland_%28detectiveschrijfster%29%2C_bij_aankomst_op_Schiphol_me%2C_Bestanddeelnr_916-8898_%28cropped%29.jpg/330px-Agatha_Christie_in_Nederland_%28detectiveschrijfster%29%2C_bij_aankomst_op_Schiphol_me%2C_Bestanddeelnr_916-8898_%28cropped%29.jpg"
    wikipedia: https://fr.wikipedia.org/wiki/Agatha_Christie
    babelio: https://www.babelio.com/auteur/agatha-christie/3638
  benoit-philippon:
    wikidata: Q27535467
